<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CargoMint 2.0 — Merchant Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

/* ── Tokens: Light ── */
:root {
  --bg-page:       #F5F4F1;
  --bg-surface:    #FFFFFF;
  --bg-raised:     #FFFFFF;
  --bg-subtle:     #F0EEE9;
  --bg-hover:      #ECEAE4;
  --bg-info:       #E6F1FB;
  --bg-success:    #E1F5EE;
  --bg-warning:    #FAEEDA;
  --bg-danger:     #FCEBEB;

  --text-primary:   #1A1917;
  --text-secondary: #5C5A55;
  --text-tertiary:  #9B9891;
  --text-info:      #185FA5;
  --text-success:   #0F6E56;
  --text-warning:   #854F0B;
  --text-danger:    #A32D2D;

  --border:         rgba(26,25,23,0.1);
  --border-med:     rgba(26,25,23,0.18);
  --border-strong:  rgba(26,25,23,0.28);

  --accent:         #185FA5;
  --accent-hover:   #0C447C;
  --accent-text:    #FFFFFF;

  --radius-sm:  6px;
  --radius-md:  8px;
  --radius-lg:  12px;
  --radius-xl:  16px;

  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'DM Mono', monospace;

  --sidebar-w: 224px;
  --topbar-h:  52px;
}

/* ── Tokens: Dark ── */
@media (prefers-color-scheme: dark) {
  :root {
    --bg-page:       #111110;
    --bg-surface:    #1A1917;
    --bg-raised:     #1F1E1C;
    --bg-subtle:     #252320;
    --bg-hover:      #2C2A27;
    --bg-info:       #0A2540;
    --bg-success:    #052318;
    --bg-warning:    #2A1A05;
    --bg-danger:     #280E0E;

    --text-primary:   #F0EEE9;
    --text-secondary: #A8A49D;
    --text-tertiary:  #6B6762;
    --text-info:      #7BB8F0;
    --text-success:   #5DCAA5;
    --text-warning:   #FAC775;
    --text-danger:    #F09595;

    --border:         rgba(240,238,233,0.08);
    --border-med:     rgba(240,238,233,0.14);
    --border-strong:  rgba(240,238,233,0.22);

    --accent:         #378ADD;
    --accent-hover:   #85B7EB;
    --accent-text:    #042C53;
  }
}

/* ── Base ── */
body {
  font-family: var(--font-body);
  background: var(--bg-page);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── Layout Shell ── */
.shell {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 0.5px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.logo {
  padding: 18px 16px 14px;
  border-bottom: 0.5px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo-icon {
  width: 30px; height: 30px;
  border-radius: var(--radius-md);
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.logo-icon svg { width: 16px; height: 16px; fill: white; }
.logo-name { font-size: 14px; font-weight: 500; }
.logo-sub { font-size: 10px; color: var(--text-tertiary); font-family: var(--font-mono); letter-spacing: .3px; }

.nav { padding: 10px 0; flex: 1; }
.nav-section { padding: 0 10px; margin-bottom: 6px; }
.nav-section-label {
  font-size: 9.5px; font-weight: 500; letter-spacing: .8px;
  text-transform: uppercase; color: var(--text-tertiary);
  padding: 6px 8px 3px;
}
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: var(--radius-md);
  cursor: pointer; font-size: 13px; color: var(--text-secondary);
  transition: background .1s, color .1s;
  user-select: none;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active { background: var(--bg-subtle); color: var(--text-primary); font-weight: 500; }
.nav-item svg { width: 14px; height: 14px; flex-shrink: 0; opacity: .65; }
.nav-item.active svg { opacity: 1; }
.nav-badge {
  margin-left: auto;
  font-size: 10px; font-family: var(--font-mono);
  background: var(--bg-info); color: var(--text-info);
  padding: 1px 7px; border-radius: 20px;
}

.sidebar-footer {
  padding: 10px;
  border-top: 0.5px solid var(--border);
}
.user-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: var(--radius-md);
  cursor: pointer;
}
.user-row:hover { background: var(--bg-hover); }
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--bg-success); color: var(--text-success);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 500; flex-shrink: 0;
}
.user-name { font-size: 12px; font-weight: 500; }
.user-email { font-size: 10px; color: var(--text-tertiary); font-family: var(--font-mono); }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

.topbar {
  height: var(--topbar-h);
  background: var(--bg-surface);
  border-bottom: 0.5px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  padding: 0 22px;
  flex-shrink: 0;
}
.topbar-title { font-size: 14px; font-weight: 500; flex: 1; }

.search-wrap {
  display: flex; align-items: center; gap: 7px;
  background: var(--bg-subtle);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-md);
  padding: 0 11px; height: 32px; width: 210px;
}
.search-wrap input {
  background: transparent; border: none; outline: none;
  font-size: 12px; color: var(--text-primary); width: 100%;
  font-family: var(--font-body);
}
.search-wrap input::placeholder { color: var(--text-tertiary); }
.search-wrap svg { width: 12px; height: 12px; color: var(--text-tertiary); flex-shrink: 0; }

.btn {
  height: 32px; padding: 0 14px;
  border-radius: var(--radius-md);
  border: 0.5px solid var(--border-med);
  background: transparent; color: var(--text-primary);
  font-size: 12px; font-family: var(--font-body);
  cursor: pointer; display: flex; align-items: center; gap: 6px;
  transition: background .1s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); }
.btn.primary {
  background: var(--accent); color: var(--accent-text);
  border-color: transparent;
}
.btn.primary:hover { background: var(--accent-hover); }

.content { flex: 1; overflow-y: auto; padding: 22px 24px; }

/* ── Metrics Grid ── */
.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}
.metric-card {
  background: var(--bg-subtle);
  border-radius: var(--radius-md);
  padding: 14px 16px;
}
.metric-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 5px; }
.metric-value { font-size: 22px; font-weight: 500; font-family: var(--font-mono); letter-spacing: -.5px; }
.metric-delta { font-size: 10px; margin-top: 4px; }
.up { color: var(--text-success); }
.down { color: var(--text-danger); }

/* ── Section Header ── */
.sec-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.sec-title { font-size: 12px; font-weight: 500; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .4px; }

/* ── Cards ── */
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 22px; }
.card {
  background: var(--bg-raised);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
}
.card-title { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 14px; }

/* ── Tenant Rows ── */
.tenant-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0;
  border-bottom: 0.5px solid var(--border);
}
.tenant-row:last-of-type { border-bottom: none; }
.t-avatar {
  width: 32px; height: 32px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500; flex-shrink: 0;
}
.t-name { font-size: 13px; font-weight: 500; }
.t-meta { font-size: 11px; color: var(--text-tertiary); }
.badge {
  font-size: 10px; padding: 2px 8px;
  border-radius: 20px; font-weight: 500; flex-shrink: 0;
}
.badge.active   { background: var(--bg-success); color: var(--text-success); }
.badge.trial    { background: var(--bg-warning); color: var(--text-warning); }
.badge.suspended{ background: var(--bg-danger);  color: var(--text-danger);  }

/* ── Bar Chart ── */
.bar-chart { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; align-items: center; gap: 8px; font-size: 11px; }
.bar-lbl { width: 72px; color: var(--text-tertiary); text-align: right; flex-shrink: 0; }
.bar-track { flex: 1; height: 7px; background: var(--bg-subtle); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; background: var(--accent); transition: width .4s ease; }
.bar-val { width: 42px; color: var(--text-secondary); font-family: var(--font-mono); font-size: 10px; }

/* ── Full-width card ── */
.full-card {
  background: var(--bg-raised);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  margin-bottom: 16px;
}

/* ── Table ── */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th {
  font-size: 10.5px; font-weight: 500; color: var(--text-tertiary);
  text-align: left; padding: 0 12px 10px 0;
  border-bottom: 0.5px solid var(--border);
  white-space: nowrap;
}
th:first-child { padding-left: 0; }
td {
  padding: 9px 12px 9px 0;
  border-bottom: 0.5px solid var(--border);
  color: var(--text-primary); vertical-align: middle;
}
td:first-child { padding-left: 0; }
tr:last-child td { border-bottom: none; }
.td-mono { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }

/* ── Status dot ── */
.dot {
  width: 6px; height: 6px; border-radius: 50%;
  display: inline-block; margin-right: 5px; vertical-align: middle;
}
.dot-green  { background: #1D9E75; }
.dot-amber  { background: #EF9F27; }
.dot-red    { background: #E24B4A; }

/* ── Icon Buttons ── */
.icon-btn {
  width: 26px; height: 26px; border-radius: var(--radius-sm);
  border: 0.5px solid var(--border);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); transition: background .1s;
}
.icon-btn:hover { background: var(--bg-hover); }
.icon-btn svg { width: 12px; height: 12px; }
.btn-group { display: flex; gap: 4px; }

/* ── Form elements ── */
.form-row { margin-bottom: 12px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.form-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; display: block; }
.form-input {
  width: 100%; height: 34px;
  padding: 0 11px;
  border: 0.5px solid var(--border-med);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  color: var(--text-primary);
  font-size: 12px; font-family: var(--font-body);
  outline: none; transition: border-color .15s;
}
.form-input:focus { border-color: var(--accent); }
.form-select {
  width: 100%; height: 34px; padding: 0 11px;
  border: 0.5px solid var(--border-med);
  border-radius: var(--radius-md);
  background: var(--bg-surface); color: var(--text-primary);
  font-size: 12px; font-family: var(--font-body);
  outline: none; cursor: pointer;
}

/* ── Modal ── */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45);
  z-index: 100; align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg-surface);
  border: 0.5px solid var(--border-med);
  border-radius: var(--radius-xl);
  padding: 24px; width: 480px;
  max-height: 90vh; overflow-y: auto;
}
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-title { font-size: 14px; font-weight: 500; }
.modal-close {
  width: 26px; height: 26px; border-radius: var(--radius-sm);
  border: 0.5px solid var(--border);
  background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-secondary); font-size: 14px;
}
.modal-close:hover { background: var(--bg-hover); }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; padding-top: 16px; border-top: 0.5px solid var(--border); }

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--text-primary); color: var(--bg-page);
  font-size: 12px; padding: 10px 16px;
  border-radius: var(--radius-md);
  opacity: 0; transform: translateY(8px);
  transition: opacity .2s, transform .2s;
  z-index: 200; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ── Settings grid ── */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.settings-section { margin-bottom: 20px; }
.settings-section-title { font-size: 11px; font-weight: 500; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 0.5px solid var(--border); }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-med); border-radius: 3px; }
</style>
</head>

let toastTimeout;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
}

  { waybill: 'CM-9821-34A', receiver: 'John Doe', destination: 'Lagos, NG', status: 'delivered', date: 'Apr 24, 2026', amount: '₦2,500' },
  { waybill: 'CM-8812-99B', receiver: 'Jane Smith', destination: 'Abuja, NG', status: 'transit', date: 'Apr 23, 2026', amount: '₦4,200' },
  { waybill: 'CM-7721-11C', receiver: 'Tech Corp', destination: 'Port Harcourt, NG', status: 'transit', date: 'Apr 23, 2026', amount: '₦1,800' },

      <div class="metrics-grid">

        <div class="metric-card"><div class="metric-label">Successful Deliveries</div><div class="metric-value">1,380</div><div class="metric-delta up">98.4% success rate</div></div>

      </div>
      <div class="card-grid">
        <div class="card">
          <div class="card-title">Recent Shipments</div>
          ${shipments.slice(0,4).map(s => `
            <div class="tenant-row">
              <div class="t-avatar" style="background:var(--bg-subtle);color:var(--text-primary)">
                <svg viewBox="0 0 16 16" fill="currentColor" style="width:12px;height:12px"><path d="M8 1a3 3 0 100 6A3 3 0 008 1zM3 10a5 5 0 0110 0v1.5a.5.5 0 01-.5.5h-9a.5.5 0 01-.5-.5V10z"/></svg>
              </div>
              <div style="flex:1;min-width:0">
                <div class="t-name">${s.waybill}</div>
                <div class="t-meta">${s.receiver} · ${s.destination}</div>
              </div>
              <span class="badge ${s.status === 'delivered' ? 'active' : s.status === 'transit' ? 'trial' : 'suspended'}">${s.status.charAt(0).toUpperCase()+s.status.slice(1)}</span>
            </div>`).join('')}
          <div style="margin-top:12px">
            <button class="btn" style="width:100%;justify-content:center" onclick="showPage('shipments')">View all shipments →</button>
          </div>
        </div>
      </div>`;
  },
  shipments() {
    return `
      <div class="sec-header">
        <span class="sec-title">All Shipments</span>
        <div style="display:flex;gap:8px">
          <button class="btn" onclick="toast('Exported CSV')">Export CSV</button>
          <button class="btn primary" onclick="toast('New Shipment')">+ New Shipment</button>
        </div>
      </div>
      <div class="full-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Waybill</th><th>Receiver</th><th>Destination</th><th>Cost</th><th>Status</th><th>Date</th><th></th></tr></thead>
            <tbody>
              ${shipments.concat(shipments).map(s => `
                <tr>
                  <td class="td-mono">${s.waybill}</td>
                  <td><span style="font-weight:500;font-size:12px">${s.receiver}</span></td>
                  <td>${s.destination}</td>
                  <td class="td-mono">${s.amount}</td>
                  <td><span class="dot dot-${s.status==='delivered'?'green':s.status==='transit'?'amber':'red'}"></span><span style="font-size:11px">${s.status.charAt(0).toUpperCase()+s.status.slice(1)}</span></td>
                  <td style="font-size:11px;color:var(--text-tertiary)">${s.date}</td>
                  <td>
                    <div class="btn-group">
                      <button class="icon-btn" title="Track" onclick="toast('Tracking ${s.waybill}')">
                        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 3C4.5 3 1.5 8 1.5 8S4.5 13 8 13s6.5-5 6.5-5S11.5 3 8 3zm0 7a2 2 0 110-4 2 2 0 010 4z"/></svg>
                      </button>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  },
  bulk() {
    return `
      <div class="sec-header">
        <span class="sec-title">Bulk Upload</span>
      </div>
      <div class="full-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;border:1px dashed var(--border-strong)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:48px;height:48px;color:var(--text-tertiary);margin-bottom:16px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <div style="font-size:14px;font-weight:500;margin-bottom:8px">Upload CSV Manifest</div>
        <div style="font-size:12px;color:var(--text-secondary);margin-bottom:24px;max-width:300px">Download our template to ensure your data is formatted correctly before uploading.</div>
        <div style="display:flex;gap:12px">
          <button class="btn" onclick="toast('Downloading template...')">Download Template</button>
          <button class="btn primary" onclick="toast('Select file...')">Select File</button>
        </div>
      </div>`;
  },
  wallet() {
    return `
      <div class="sec-header"><span class="sec-title">Wallet & Invoices</span></div>
      <div class="metrics-grid">
        <div class="metric-card"><div class="metric-label">Available Balance</div><div class="metric-value">₦450,000</div><button class="btn primary" style="margin-top:8px" onclick="toast('Top up modal')">Top up wallet</button></div>
      </div>
      <div class="full-card">
        <div class="sec-title" style="margin-bottom:12px">Recent Transactions</div>
        <table style="width:100%">
          <thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead>
          <tbody>
            <tr><td style="font-size:11px;color:var(--text-tertiary)">Apr 24</td><td>Shipment deduction</td><td class="td-mono" style="color:var(--text-danger)">-₦2,500</td></tr>
            <tr><td style="font-size:11px;color:var(--text-tertiary)">Apr 23</td><td>Wallet top up via Paystack</td><td class="td-mono" style="color:var(--text-success)">+₦500,000</td></tr>
            <tr><td style="font-size:11px;color:var(--text-tertiary)">Apr 23</td><td>Shipment deduction</td><td class="td-mono" style="color:var(--text-danger)">-₦4,200</td></tr>
          </tbody>
        </table>
      </div>`;
  },
  api() {
    return `
      <div class="sec-header"><span class="sec-title">API Keys</span><button class="btn primary" onclick="toast('Generate new key')">+ Generate Key</button></div>
      <div class="full-card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Token</th><th>Created</th><th>Status</th><th></th></tr></thead>
            <tbody>
              <tr>
                <td>Production Key</td>
                <td class="td-mono">pk_live_*******************</td>
                <td style="font-size:11px;color:var(--text-tertiary)">Jan 12, 2026</td>
                <td><span class="dot dot-green"></span><span style="font-size:11px">Active</span></td>
                <td><button class="btn" style="height:24px;padding:0 8px;font-size:10px" onclick="toast('Copied')">Copy</button></td>
              </tr>
              <tr>
                <td>Test Key</td>
                <td class="td-mono">pk_test_*******************</td>
                <td style="font-size:11px;color:var(--text-tertiary)">Jan 12, 2026</td>
                <td><span class="dot dot-green"></span><span style="font-size:11px">Active</span></td>
                <td><button class="btn" style="height:24px;padding:0 8px;font-size:10px" onclick="toast('Copied')">Copy</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>`;
  }
};

function showPage(name) {
  const fn = pages[name] || pages.dashboard;
  document.getElementById('content-area').innerHTML = fn();
  document.getElementById('page-title').textContent = 
    {dashboard:'Dashboard',shipments:'Shipments',bulk:'Bulk Upload',wallet:'Wallet',api:'API Keys'}[name] || name;
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === name);
  });
}

// Init
showPage('dashboard');

// Routing events
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    if(el.dataset.page) showPage(el.dataset.page);
  });
});
</script>
</body>
</html>
